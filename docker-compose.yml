services:
  db:
    image: postgres:16
    container_name: equipment-rental-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: equipment_rental
      POSTGRES_USER: warmack
      POSTGRES_PASSWORD: warmack

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
      # init-скрипты применяются только при первом старте (пустой volume)
      - ./docker/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warmack -d equipment_rental"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: